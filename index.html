<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity 05 - CSS Arcade Night</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>CSS Arcade Night</h1>
    <p>Flexbox • Grid • Keyframes • Positioning &amp; z-index</p>
  </header>

  <main>
    <section class="panel" aria-labelledby="flex-title">
      <h2 id="flex-title">Flexbox Zone</h2>
      <div class="flex-demo">
        <div class="card">Flex 1</div>
        <div class="card">Flex 2</div>
        <div class="card">Flex 3</div>
      </div>
    </section>

    <section class="panel" aria-labelledby="grid-title">
      <h2 id="grid-title">Grid Zone</h2>
      <div class="grid-demo">
        <div class="cell">1</div>
        <div class="cell">2</div>
        <div class="cell">3</div>
        <div class="cell">4</div>
        <div class="cell">5</div>
        <div class="cell">6</div>
        <div class="cell">7</div>
        <div class="cell">8</div>
        <div class="cell">9</div>
      </div>
    </section>

    <section class="panel" aria-labelledby="motion-title">
      <h2 id="motion-title">Motion Zone</h2>
      <div class="motion-stage">
        <div class="pixel-ball" aria-label="Animated arcade ball"></div>
      </div>
    </section>

    <section class="panel" aria-labelledby="layers-title">
      <h2 id="layers-title">Layering Zone</h2>
      <div class="layer-demo">
        <div class="layer back">BACK</div>
        <div class="layer middle">MIDDLE</div>
        <div class="layer front">FRONT</div>
      </div>
    </section>
  </main>

  <footer>
    <p>Activity 05 — CSS Arcade Night</p>
  </footer>
</body>
</html>

<!-- Updated for Activity 05 CSS Arcade Night -->
